[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sabermath"
description = "SABER-Math: Benchmark for Information Retrieval Evaluation in Mathematics"
requires-python = ">=3.10"
dynamic = ["version"]
license = "CC-BY-SA-4.0"
license-files = ["LICENCE"]
readme = "README.md"
authors = [
    { name = "Nikolay Georgiev" },
    { name = "Maria Drencheva" },
    { name = "Kseniia Ibragimova" },
    { name = "Ivo Petrov" },
    { name = "Dimitar I. Dimitrov" },
    { name = "Martin Vechev" },
]

dependencies = [
    "sentence-transformers>=5.4.1",
    "numpy>=2.2.6,<2.3; python_version < '3.11'",
    "numpy>=2.4.4; python_version >= '3.11'",
    "tqdm>=4.67.3",
    "datasets>=4.8.5",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "requests>=2.31",
    "openai>=2.33.0",
]

[project.optional-dependencies]
vllm = [
    "vllm==0.26.0",
    "flashinfer-python==0.6.14"
]

[project.urls]
Homepage = "https://sabermath.insait.ai"
Source = "https://github.com/insait-institute/sabermath-benchmark"
Documentation = "https://github.com/insait-institute/sabermath-benchmark/blob/master/docs/README.md"
Paper = "https://arxiv.org/abs/2606.29894"
Dataset = "https://huggingface.co/collections/INSAIT-Institute/saber-math"

[project.scripts]
sabermath = "sabermath.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sabermath.__version__.__version__" }
